name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-server.txt
      - run: python -m unittest discover -v
      - run: node --check static/app.js
      - name: Check Linux scripts
        if: runner.os == 'Linux'
        run: for script in linux/*.sh; do bash -n "$script" || exit; done
      - name: Build clean deployment package
        run: python build_package.py dist/ras-log-analyser-upload-only.tar.gz

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Debian-based container
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify deployed header identifies the checkout
        run: curl -fsS http://127.0.0.1:8768/ | grep -F "v1.1+${GITHUB_SHA:0:8}"
      - name: Test uploads and persistence across container replacement
        run: python3 container_smoke.py
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove disposable CI containers and test volume
        if: always()
        run: docker compose down --volumes

  azure-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install on fresh checkout with LAN binding
        run: |
          sudo bash install-azure.sh --lan
          cd /opt/ras-log-analyser-azure
          test "$(sudo docker compose port analyser 8766)" = "0.0.0.0:8768"
          curl -fsS http://127.0.0.1:8768/api/settings
      - name: Repeat install as an update and verify the backup
        run: |
          sudo bash install-azure.sh
          cd /opt/ras-log-analyser-azure
          test "$(sudo docker compose port analyser 8766)" = "0.0.0.0:8768"
          sudo docker compose exec -T analyser sh -c 'ls /data/backups/*.tar.gz'
