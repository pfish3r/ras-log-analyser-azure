name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-server.txt
      - run: python -m unittest discover -v
      - run: node --check static/app.js
      - name: Check Linux scripts
        if: runner.os == 'Linux'
        run: for script in linux/*.sh; do bash -n "$script" || exit; done
      - name: Build clean deployment package
        run: python build_package.py dist/ras-log-analyser-upload-only.tar.gz
